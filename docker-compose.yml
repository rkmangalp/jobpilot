services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: jobpilot
      MYSQL_USER: jobpilot
      MYSQL_PASSWORD: jobpilot
      MYSQL_ROOT_PASSWORD: local-root-only
    ports: ["3306:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      JOBPILOT_ADDR: :8080
      JOBPILOT_ENV: development
    ports: ["8080:8080"]
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  mysql-data:
